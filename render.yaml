services:
  - type: web
    name: composio-toolkit-radar-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
